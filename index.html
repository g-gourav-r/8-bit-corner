<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sunflower Corner - A Retro Mini-Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #1a1e29;
      font-family: 'Press Start 2P', monospace, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    #console-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 880px;
      background: linear-gradient(145deg, #2b3952, #182236);
      border: 4px solid #475a7c;
      border-radius: 28px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px;
      touch-action: none;
    }

    #console-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 880px;
      background: linear-gradient(145deg, #2b3952, #182236);
      border: 4px solid #475a7c;
      border-radius: 28px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px;
    }

    /* Screen Bezel */
    #screen-housing {
      position: relative;
      background: #111620;
      border-radius: 14px;
      padding: 10px;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.8);
      border: 3px solid #202b3d;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #screen-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 6px;
      font-size: 8px;
      color: #ffd154;
      text-shadow: 1px 1px #000;
    }

    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #48a048;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Dialogue box overlay */
    #dialogue-overlay {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(16, 28, 48, 0.95);
      border: 3px solid #fbd354;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 8px;
      line-height: 1.6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      display: none;
      z-index: 20;
    }

    #dialogue-name {
      color: #ffde59;
      font-size: 9px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    #dialogue-text {
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 38px;
    }

    #dialogue-prompt {
      text-align: right;
      font-size: 7px;
      color: #7de87d;
      margin-top: 4px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bottom Controller Area */
    #controls-container {
      margin-top: 10px;
      padding: 8px 4px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 180px;
    }

    /* Retro D-Pad */
    .d-pad-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      touch-action: none;
    }

    .d-btn {
      position: absolute;
      background: #242c3c;
      border: 2px solid #141822;
      box-shadow: 0 4px 0 #0d1017, inset 0 1px 1px rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #839bbd;
      transition: transform 0.05s, box-shadow 0.05s;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .d-btn:active, .d-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d1017;
      background: #344057;
      color: #fff;
    }

    #d-up {
      width: 42px;
      height: 46px;
      top: 0;
      left: 44px;
      border-radius: 8px 8px 0 0;
    }
    #d-down {
      width: 42px;
      height: 46px;
      bottom: 0;
      left: 44px;
      border-radius: 0 0 8px 8px;
    }
    #d-left {
      width: 46px;
      height: 42px;
      top: 44px;
      left: 0;
      border-radius: 8px 0 0 8px;
    }
    #d-right {
      width: 46px;
      height: 42px;
      top: 44px;
      right: 0;
      border-radius: 0 8px 8px 0;
    }
    .d-center {
      position: absolute;
      width: 42px;
      height: 42px;
      background: #242c3c;
      top: 44px;
      left: 44px;
      pointer-events: none;
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      gap: 16px;
      align-items: center;
      transform: rotate(-12deg);
      margin-right: 12px;
    }

    .action-btn-sub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .circle-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #d63c5a;
      border: 3px solid #851c31;
      box-shadow: 0 6px 0 #59111f, inset 0 2px 2px rgba(255,255,255,0.4);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.05s, box-shadow 0.05s;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .circle-btn:active, .circle-btn.active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #59111f;
      background: #b52b46;
    }

    .btn-label {
      font-size: 8px;
      color: #8c9fb6;
      letter-spacing: 1px;
    }

    /* Audio Toggle Button */
    #sound-toggle {
      background: #242c3c;
      color: #ffde59;
      border: 1px solid #4a5c78;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 7px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

<div id="console-wrapper">
  <div id="screen-housing">
    <div id="screen-top-bar">
      <span>🌻 SUNFLOWER CORNER</span>
      <button id="sound-toggle">🎵 AUDIO: ON</button>
    </div>
    
    <div id="canvas-container">
      <canvas id="gameCanvas" width="240" height="240"></canvas>
      
      <!-- Dialogue Box -->
      <div id="dialogue-overlay">
        <div id="dialogue-name">Friend</div>
        <div id="dialogue-text">...</div>
        <div id="dialogue-prompt">[PRESS A]</div>
      </div>
    </div>
  </div>

  <!-- Physical Mobile Controls -->
  <div id="controls-container">
    <div class="d-pad-wrap">
      <div class="d-btn" id="d-up">▲</div>
      <div class="d-btn" id="d-left">◀</div>
      <div class="d-center"></div>
      <div class="d-btn" id="d-right">▶</div>
      <div class="d-btn" id="d-down">▼</div>
    </div>

    <div class="action-group">
      <div class="action-btn-sub">
        <div class="circle-btn" id="btn-a">A</div>
        <span class="btn-label">ACTION</span>
      </div>
    </div>
  </div>
</div>

<script>
const AudioFX = {
  ctx: null,
  enabled: true,
  init() {
    if (!this.ctx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContextClass();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  playTone(freq, type = 'square', duration = 0.08, vol = 0.15) {
    if (!this.enabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  },
  step() {
    this.playTone(110, 'triangle', 0.04, 0.08);
  },
  chirp() {
    this.playTone(620, 'square', 0.05, 0.1);
    setTimeout(() => this.playTone(880, 'square', 0.08, 0.1), 50);
  },
  petalPickup() {
    this.playTone(587.33, 'triangle', 0.1, 0.2); // D5
    setTimeout(() => this.playTone(739.99, 'triangle', 0.12, 0.2), 90); // F#5
    setTimeout(() => this.playTone(880.00, 'triangle', 0.16, 0.25), 180); // A5
    setTimeout(() => this.playTone(1174.66, 'sine', 0.25, 0.2), 270); // D6
  },
  elephantTrumpet() {
    this.playTone(220, 'sawtooth', 0.12, 0.12);
    setTimeout(() => this.playTone(330, 'sawtooth', 0.18, 0.14), 100);
    setTimeout(() => this.playTone(440, 'triangle', 0.22, 0.1), 220);
  },
  lullaby() {
    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      setTimeout(() => {
        this.playTone(freq, 'sine', 0.35, 0.2);
      }, i * 220);
    });
  }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Dialogue & UI element references
const dialogueOverlay = document.getElementById('dialogue-overlay');
const dialogueNameEl = document.getElementById('dialogue-name');
const dialogueTextEl = document.getElementById('dialogue-text');
const dialoguePromptEl = document.getElementById('dialogue-prompt');
const soundToggleBtn = document.getElementById('sound-toggle');

// Dialogue State Management
let isDialogueOpen = false;
let dialogueQueue = [];
let onDialogueComplete = null;

function triggerDialogue(speaker, messages, callback = null) {
  if (!dialogueOverlay) return;
  isDialogueOpen = true;
  dialogueQueue = [...messages];
  onDialogueComplete = callback;
  if (dialogueNameEl) dialogueNameEl.textContent = speaker;
  dialogueOverlay.style.display = 'block';
  showNextDialogueLine();
}

function showNextDialogueLine() {
  if (dialogueQueue.length === 0) {
    closeDialogue();
    return;
  }
  const current = dialogueQueue.shift();
  if (dialogueTextEl) dialogueTextEl.textContent = current.text;
  if (dialoguePromptEl) dialoguePromptEl.textContent = current.prompt || "[PRESS A]";
  AudioFX.chirp();
}

function advanceDialogue() {
  if (!isDialogueOpen) return;
  if (dialogueQueue.length > 0) {
    showNextDialogueLine();
  } else {
    closeDialogue();
  }
}

function closeDialogue() {
  isDialogueOpen = false;
  if (dialogueOverlay) dialogueOverlay.style.display = 'none';
  if (onDialogueComplete) {
    const cb = onDialogueComplete;
    onDialogueComplete = null;
    cb();
  }
}

// 16x16 pixel grid per tile. Screen is 240x240 (15x15 tiles)
const TILE_SIZE = 16;
const MAP_COLS = 15;
const MAP_ROWS = 15;

const keys = {
  up: false,
  down: false,
  left: false,
  right: false,
  action: false
};

// Player Entity
const player = {
  x: 7 * TILE_SIZE,
  y: 11 * TILE_SIZE,
  w: 12,
  h: 14,
  speed: 1.25,
  dir: 'up',
  stepAnim: 0,
  isMoving: false,
  petalsFound: 0
};

// The friend waiting at the scenic top-right bench
const friend = {
  x: 12 * TILE_SIZE,
  y: 2 * TILE_SIZE,
  w: 12,
  h: 14,
  name: "Best Friend"
};

// Cute Sunflower Elephants
const elephants = [
  {
    x: 2 * TILE_SIZE,
    y: 6 * TILE_SIZE,
    w: 24,
    h: 18,
    name: "Sunny",
    earOffset: 0,
    dir: 1
  },
  {
    x: 9 * TILE_SIZE,
    y: 8 * TILE_SIZE,
    w: 24,
    h: 18,
    name: "Bloom",
    earOffset: 0,
    dir: -1
  }
];

// Readily accessible Golden Sunflower Petals
const collectiblePetals = [
  { x: 2 * TILE_SIZE + 4, y: 3 * TILE_SIZE + 4, collected: false, id: 1 },
  { x: 12 * TILE_SIZE + 4, y: 11 * TILE_SIZE + 4, collected: false, id: 2 },
  { x: 6 * TILE_SIZE + 4, y: 7 * TILE_SIZE + 4, collected: false, id: 3 }
];

// Particle and popup message system
let particles = [];
let floatingPopups = [];
let celebrationMode = false;

function spawnHeartParticles(x, y) {
  for (let i = 0; i < 7; i++) {
    particles.push({
      x: x + 6,
      y: y + 2,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -0.8 - Math.random() * 1.2,
      life: 40 + Math.random() * 20,
      color: Math.random() > 0.4 ? '#ff5277' : '#ffd700',
      type: 'heart'
    });
  }
}

function spawnPetalPop(x, y) {
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 1.4;
    particles.push({
      x: x + 6,
      y: y + 6,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.5,
      life: 35 + Math.random() * 20,
      color: Math.random() > 0.3 ? '#ffe153' : '#fffa9e',
      type: 'confetti'
    });
  }
  // Floating text notification
  floatingPopups.push({
    x: x - 12,
    y: y - 4,
    text: "+1 PETAL! 🌻",
    life: 55,
    vy: -0.6
  });
}
// Draws a tiny 8-bit sunflower
function drawPixelSunflower(cx, cy, scale = 1) {
  ctx.fillStyle = "#2d702d";
  ctx.fillRect(cx + 3 * scale, cy + 5 * scale, 2 * scale, 6 * scale); // stem
  ctx.fillStyle = "#4a9c3d";
  ctx.fillRect(cx + 1 * scale, cy + 7 * scale, 2 * scale, 2 * scale); // leaf

  ctx.fillStyle = "#ffc825"; // yellow petals
  ctx.fillRect(cx + 2 * scale, cy + 1 * scale, 4 * scale, 6 * scale);
  ctx.fillRect(cx + 1 * scale, cy + 2 * scale, 6 * scale, 4 * scale);

  ctx.fillStyle = "#8a4513"; // seed center
  ctx.fillRect(cx + 3 * scale, cy + 3 * scale, 2 * scale, 2 * scale);
}

// Draws the friendly sunflower elephants with decorative patterns
function drawPixelElephant(el) {
  const x = Math.round(el.x);
  const y = Math.round(el.y);

  // Body (Gentle blue-grey)
  ctx.fillStyle = "#8aa0b8";
  ctx.fillRect(x + 4, y + 4, 16, 11);
  ctx.fillRect(x + 2, y + 6, 20, 8);

  // Legs
  ctx.fillStyle = "#6d839c";
  ctx.fillRect(x + 4, y + 14, 3, 4);
  ctx.fillRect(x + 9, y + 14, 3, 4);
  ctx.fillRect(x + 14, y + 14, 3, 4);
  ctx.fillRect(x + 18, y + 14, 3, 4);

  // Trunk
  ctx.fillStyle = "#8aa0b8";
  if (el.dir > 0) {
    ctx.fillRect(x + 20, y + 8, 3, 4);
    ctx.fillRect(x + 22, y + 11, 2, 4);
    ctx.fillRect(x + 23, y + 14, 2, 2);
  } else {
    ctx.fillRect(x + 1, y + 8, 3, 4);
    ctx.fillRect(x - 1, y + 11, 2, 4);
    ctx.fillRect(x - 2, y + 14, 2, 2);
  }

  // Ear with gentle sway animation
  const earWiggle = Math.sin(Date.now() * 0.004 + el.x) * 1.5;
  ctx.fillStyle = "#7991a9";
  if (el.dir > 0) {
    ctx.fillRect(x + 15 + earWiggle, y + 4, 4, 7);
  } else {
    ctx.fillRect(x + 5 + earWiggle, y + 4, 4, 7);
  }

  // Eye
  ctx.fillStyle = "#1e2836";
  if (el.dir > 0) {
    ctx.fillRect(x + 19, y + 7, 2, 2);
  } else {
    ctx.fillRect(x + 3, y + 7, 2, 2);
  }

  // Sunflower blanket / pattern on back
  ctx.fillStyle = "#ffb703";
  ctx.fillRect(x + 8, y + 5, 8, 6);
  ctx.fillStyle = "#8b4513";
  ctx.fillRect(x + 11, y + 7, 2, 2);
  ctx.fillStyle = "#fff475";
  ctx.fillRect(x + 11, y + 6, 2, 1);
  ctx.fillRect(x + 11, y + 9, 2, 1);
}

// Draws the player & friend sprites
function drawCharacter(c, isFriend = false) {
  const px = Math.round(c.x);
  const py = Math.round(c.y);

  // Shadow
  ctx.fillStyle = "rgba(10, 40, 10, 0.4)";
  ctx.fillRect(px + 1, py + 12, 10, 3);

  // Hair
  ctx.fillStyle = isFriend ? "#e76f51" : "#2a9d8f";
  ctx.fillRect(px + 3, py + 1, 6, 4);
  ctx.fillRect(px + 2, py + 2, 8, 2);

  // Face
  ctx.fillStyle = "#ffd8be";
  ctx.fillRect(px + 3, py + 4, 6, 4);

  // Eyes
  ctx.fillStyle = "#1d3557";
  ctx.fillRect(px + 4, py + 5, 1, 1);
  ctx.fillRect(px + 7, py + 5, 1, 1);

  // Clothes
  ctx.fillStyle = isFriend ? "#f4a261" : "#3a86ff";
  ctx.fillRect(px + 3, py + 8, 6, 5);

  // Scarf / flower accessory
  ctx.fillStyle = "#ffb703";
  ctx.fillRect(px + 4, py + 7, 4, 2);

  // Feet / walking animation
  ctx.fillStyle = "#264653";
  let stepOffset = 0;
  if (!isFriend && player.isMoving) {
    stepOffset = Math.sin(player.stepAnim * 0.4) > 0 ? 1 : -1;
  }
  ctx.fillRect(px + 3, py + 13 + (stepOffset > 0 ? 1 : 0), 2, 2);
  ctx.fillRect(px + 7, py + 13 + (stepOffset < 0 ? 1 : 0), 2, 2);
}

function renderWorld() {
  // 1. Lush Green Ground
  ctx.fillStyle = "#489f48";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Soft grass patches
  ctx.fillStyle = "#3e8c3e";
  for (let r = 0; r < MAP_ROWS; r += 2) {
    for (let c = 0; c < MAP_COLS; c += 2) {
      if ((r + c) % 3 === 0) {
        ctx.fillRect(c * TILE_SIZE + 4, r * TILE_SIZE + 6, 4, 2);
      }
    }
  }

  // 2. Winding Dirt Path
  ctx.fillStyle = "#d8b26e";
  // Main road from bottom to clearing
  ctx.fillRect(6 * TILE_SIZE, 5 * TILE_SIZE, 3 * TILE_SIZE, 10 * TILE_SIZE);
  // Branch going towards friend's corner at top-right
  ctx.fillRect(7 * TILE_SIZE, 3 * TILE_SIZE, 6 * TILE_SIZE, 3 * TILE_SIZE);
  // Branch to left clearing
  ctx.fillRect(2 * TILE_SIZE, 6 * TILE_SIZE, 5 * TILE_SIZE, 2 * TILE_SIZE);

  // Path edge detail
  ctx.fillStyle = "#c59f5b";
  ctx.fillRect(6 * TILE_SIZE, 5 * TILE_SIZE, 1, 10 * TILE_SIZE);
  ctx.fillRect(9 * TILE_SIZE - 1, 5 * TILE_SIZE, 1, 10 * TILE_SIZE);

  // 3. Cozy Cottage on Top-Left
  ctx.fillStyle = "#7b4f2c"; // walls
  ctx.fillRect(1 * TILE_SIZE, 1 * TILE_SIZE, 3 * TILE_SIZE, 3 * TILE_SIZE);
  ctx.fillStyle = "#c84630"; // roof
  ctx.fillRect(0 * TILE_SIZE + 10, 0 * TILE_SIZE + 6, 3 * TILE_SIZE + 12, 14);
  ctx.fillStyle = "#fde2b4"; // door
  ctx.fillRect(2 * TILE_SIZE, 2 * TILE_SIZE + 8, 12, 16);
  ctx.fillStyle = "#4a2d13";
  ctx.fillRect(2 * TILE_SIZE + 9, 3 * TILE_SIZE + 2, 2, 2); // knob

  // 4. Scenic Corner Bench & Giant SunTree (Top Right)
  ctx.fillStyle = "#8a5127";
  ctx.fillRect(11 * TILE_SIZE + 4, 2 * TILE_SIZE + 6, 20, 8);
  ctx.fillStyle = "#5c3314";
  ctx.fillRect(11 * TILE_SIZE + 4, 2 * TILE_SIZE + 13, 3, 4);
  ctx.fillRect(12 * TILE_SIZE + 9, 2 * TILE_SIZE + 13, 3, 4);

  // Giant Sunflower Tree
  const tx = 13 * TILE_SIZE;
  const ty = 0 * TILE_SIZE + 4;
  ctx.fillStyle = "#538d38";
  ctx.beginPath();
  ctx.arc(tx + 8, ty + 12, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#75be48";
  ctx.beginPath();
  ctx.arc(tx + 6, ty + 10, 14, 0, Math.PI * 2);
  ctx.fill();
  drawPixelSunflower(tx - 2, ty + 2, 1.4);

  // 5. Decorative background sunflowers
  const sunflowerLocations = [
    [0, 5], [0, 6], [1, 7], [1, 9], [0, 11], [1, 13],
    [5, 4], [5, 10], [5, 12],
    [9, 4], [9, 11], [10, 12],
    [10, 0], [10, 5], [14, 6], [14, 8], [14, 10]
  ];
  sunflowerLocations.forEach(([col, row]) => {
    drawPixelSunflower(col * TILE_SIZE + 2, row * TILE_SIZE + 2);
  });

  // 6. Draw Highly-Visible Golden Petals
  const now = Date.now();
  collectiblePetals.forEach((petal, idx) => {
    if (!petal.collected) {
      const bob = Math.sin(now * 0.007 + idx * 2) * 3;
      const pulse = (Math.sin(now * 0.01 + idx) + 1) * 0.5;

      // Outer golden halo
      ctx.fillStyle = `rgba(255, 230, 80, ${0.25 + pulse * 0.35})`;
      ctx.beginPath();
      ctx.arc(petal.x + 6, petal.y + 6 + bob, 9 + pulse * 3, 0, Math.PI * 2);
      ctx.fill();

      // Shadow below petal
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.beginPath();
      ctx.ellipse(petal.x + 6, petal.y + 13, 6, 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Golden Petal core
      ctx.fillStyle = "#ffb703";
      ctx.beginPath();
      ctx.ellipse(petal.x + 6, petal.y + 6 + bob, 5, 7, (now * 0.002 + idx), 0, Math.PI * 2);
      ctx.fill();

      // Inner warm highlight
      ctx.fillStyle = "#fff37a";
      ctx.beginPath();
      ctx.arc(petal.x + 5, petal.y + 4 + bob, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Sparkle cross
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(petal.x + 5, petal.y + 1 + bob, 2, 1);
      ctx.fillRect(petal.x + 4, petal.y + 2 + bob, 4, 1);
      ctx.fillRect(petal.x + 5, petal.y + 3 + bob, 2, 1);
    }
  });

  // 7. Draw Elephants
  elephants.forEach(el => drawPixelElephant(el));

  // 8. Draw Friend Sprite
  drawCharacter(friend, true);

  // 9. Draw Player
  drawCharacter(player, false);

  // 10. Update & Render Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (p.type === 'heart') {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
      ctx.fillRect(p.x + 2, p.y - 1, 2, 2);
    } else if (p.type === 'confetti') {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
    }

    if (p.life <= 0) particles.splice(i, 1);
  }

  // 11. Render floating "+1 PETAL!" popups
  for (let i = floatingPopups.length - 1; i >= 0; i--) {
    const pop = floatingPopups[i];
    pop.y += pop.vy;
    pop.life--;

    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.font = "6px 'Press Start 2P', monospace";
    ctx.fillText(pop.text, pop.x + 1, pop.y + 1);
    ctx.fillStyle = "#ffe24a";
    ctx.fillText(pop.text, pop.x, pop.y);

    if (pop.life <= 0) floatingPopups.splice(i, 1);
  }

  // Celebratory snowfall after dialogue
  if (celebrationMode && Math.random() < 0.3) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -4,
      vx: (Math.random() - 0.5) * 0.8,
      vy: 0.6 + Math.random() * 0.8,
      life: 280,
      color: Math.random() > 0.3 ? '#ffe153' : '#ff9ebb',
      type: 'confetti'
    });
  }

  // HUD: Petal counter & quest prompt
  ctx.fillStyle = "rgba(18, 25, 38, 0.85)";
  ctx.fillRect(4, 4, 134, 16);
  ctx.strokeStyle = "#475a7c";
  ctx.lineWidth = 1;
  ctx.strokeRect(4, 4, 134, 16);

  ctx.fillStyle = player.petalsFound === 3 ? "#7de87d" : "#ffde59";
  ctx.font = "6px 'Press Start 2P', monospace";
  if (player.petalsFound < 3) {
    ctx.fillText(`🌻 PETALS: ${player.petalsFound}/3`, 8, 15);
  } else {
    ctx.fillText(`🌻 ALL 3 FOUND!`, 8, 15);
  }
}
function checkProximity(a, b, dist = 22) {
  const ax = a.x + a.w / 2;
  const ay = a.y + a.h / 2;
  const bx = b.x + (b.w ? b.w / 2 : 6);
  const by = b.y + (b.h ? b.h / 2 : 6);
  return Math.hypot(ax - bx, ay - by) < dist;
}

// Automatically check and pick up petals without blocking player walk
function checkAutomaticPetalPickup() {
  for (let i = 0; i < collectiblePetals.length; i++) {
    const petal = collectiblePetals[i];
    if (!petal.collected && checkProximity(player, petal, 22)) {
      petal.collected = true;
      player.petalsFound++;
      AudioFX.petalPickup();
      spawnPetalPop(petal.x, petal.y);

      // If all petals found, hint towards friend's corner
      if (player.petalsFound === 3) {
        setTimeout(() => {
          if (!isDialogueOpen) {
            triggerDialogue("Sunflower Field", [
              {
                text: `You gathered all 3 golden petals! 🌻✨\nVisit your friend waiting at the quiet corner bench.`,
                prompt: "[PRESS A]"
              }
            ]);
          }
        }, 300);
      }
    }
  }
}

function handleInteractions() {
  if (isDialogueOpen) {
    advanceDialogue();
    return;
  }

  // 1. Sunflower Elephants Interaction
  for (let el of elephants) {
    if (checkProximity(player, el, 28)) {
      AudioFX.elephantTrumpet();
      spawnHeartParticles(el.x + 8, el.y);
      triggerDialogue(el.name + " the Elephant", [
        {
          text: `The sunflower elephant gently nudges you with warmth... 🌻🐘\nIts blanket smells like sunbeams.`,
          prompt: "[PRESS A]"
        },
        {
          text: `It whispers: "Take your time. Strong friendships never wear thin."`,
          prompt: "[PRESS A]"
        }
      ]);
      return;
    }
  }

  // 2. Friend at the Scenic Corner Bench
  if (checkProximity(player, friend, 26)) {
    AudioFX.lullaby();
    spawnHeartParticles(friend.x, friend.y);

    if (celebrationMode) {
      triggerDialogue("Friend", [
        {
          text: `“I'll be there at a corner until u sort your things thats the promise I made and i will keep”`,
          prompt: "[PRESS A]"
        },
        {
          text: `Always right here for you. Whenever you look back, I'm at our corner. 💛`,
          prompt: "[HELD PROMISE 🌻]"
        }
      ]);
      return;
    }

    const dialogueSeq = [
      {
        text: `Hey! You made it all the way to our favorite sunflower corner.`,
        prompt: "[PRESS A]"
      },
      {
        text: `Look at the elephants and petals you brought. Thank you for walking this road with me.`,
        prompt: "[PRESS A]"
      },
      {
        text: `“I'll be there at a corner until u sort your things thats the promise I made and i will keep”`,
        prompt: "[PRESS A TO SEAL PROMISE]"
      },
      {
        text: `No matter how big the world gets, this corner is yours whenever you need it. 🌻✨`,
        prompt: "[PRESS A]"
      }
    ];

    triggerDialogue("Friend", dialogueSeq, () => {
      celebrationMode = true;
      AudioFX.lullaby();
      for (let i = 0; i < 30; i++) {
        spawnHeartParticles(friend.x - 10 + Math.random() * 20, friend.y - 10 + Math.random() * 20);
      }
    });
    return;
  }

  // Check if player pressed action near a petal manually
  for (let petal of collectiblePetals) {
    if (!petal.collected && checkProximity(player, petal, 24)) {
      petal.collected = true;
      player.petalsFound++;
      AudioFX.petalPickup();
      spawnPetalPop(petal.x, petal.y);
      return;
    }
  }

  AudioFX.chirp();
}

function updateGame() {
  if (!isDialogueOpen) {
    let dx = 0;
    let dy = 0;

    if (keys.up) { dy -= player.speed; player.dir = 'up'; }
    if (keys.down) { dy += player.speed; player.dir = 'down'; }
    if (keys.left) { dx -= player.speed; player.dir = 'left'; }
    if (keys.right) { dx += player.speed; player.dir = 'right'; }

    player.isMoving = (dx !== 0 || dy !== 0);

    if (player.isMoving) {
      player.stepAnim++;
      if (player.stepAnim % 18 === 0) {
        AudioFX.step();
      }
    }

    const nextX = Math.max(8, Math.min(canvas.width - player.w - 8, player.x + dx));
    const nextY = Math.max(8, Math.min(canvas.height - player.h - 8, player.y + dy));

    // Cottage Obstacle collision
    const inCottage = (nextX < 4 * TILE_SIZE && nextY < 4 * TILE_SIZE);
    if (!inCottage) {
      player.x = nextX;
      player.y = nextY;
    }

    // Automatically check petal pickups as player walks over them
    checkAutomaticPetalPickup();
  }

  renderWorld();
  requestAnimationFrame(updateGame);
}
// Multi-touch friendly listeners
function bindTouchButton(elementId, onPress, onRelease) {
  const el = document.getElementById(elementId);
  if (!el) return;

  const startPress = (e) => {
    e.preventDefault();
    e.stopPropagation();
    AudioFX.init();
    el.classList.add('active');
    if (onPress) onPress();
  };

  const endPress = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('active');
    if (onRelease) onRelease();
  };

  el.addEventListener('touchstart', startPress, { passive: false });
  el.addEventListener('touchend', endPress, { passive: false });
  el.addEventListener('touchcancel', endPress, { passive: false });
  el.addEventListener('mousedown', startPress);
  el.addEventListener('mouseup', endPress);
  el.addEventListener('mouseleave', endPress);
}

bindTouchButton('d-up', () => keys.up = true, () => keys.up = false);
bindTouchButton('d-down', () => keys.down = true, () => keys.down = false);
bindTouchButton('d-left', () => keys.left = true, () => keys.left = false);
bindTouchButton('d-right', () => keys.right = true, () => keys.right = false);
bindTouchButton('btn-a', () => handleInteractions(), null);

// Keyboard Controls (WASD & Arrow Keys + Space/Enter)
window.addEventListener('keydown', (e) => {
  AudioFX.init();
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') {
    handleInteractions();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Sound Toggle Listener
if (soundToggleBtn) {
  soundToggleBtn.addEventListener('click', () => {
    AudioFX.enabled = !AudioFX.enabled;
    soundToggleBtn.textContent = AudioFX.enabled ? "🎵 AUDIO: ON" : "🔇 AUDIO: OFF";
  });
}

if (dialogueOverlay) {
  dialogueOverlay.addEventListener('click', (e) => {
    e.preventDefault();
    handleInteractions();
  });
  dialogueOverlay.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInteractions();
  }, { passive: false });
}

window.onload = function() {
  updateGame();
  
  // Warm initial intro prompt
  setTimeout(() => {
    triggerDialogue("Guide", [
      {
        text: `Welcome to Sunflower Corner. 🌻\nWalk over the golden glowing petals to collect them!`,
        prompt: "[PRESS A]"
      },
      {
        text: `Meet the sunflower elephants and find your friend under the golden sun tree.`,
        prompt: "[PRESS A TO START]"
      }
    ]);
  }, 400);
};
